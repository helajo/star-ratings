<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Infra Universe Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a sticky masthead, then a market-desk column (brief → breadth → signals → names → clusters → earnings →
   fundamentals); summary before detail; every number tabular; up/down always carries a sign or arrow as well as colour. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eceff4;
  --ink: #0e1621;
  --ink-2: #485364;
  --muted: #747f8f;
  --line: #dde2e9;
  --line-strong: #c3cad5;
  --accent: #1f4fc4;
  --accent-ink: #ffffff;
  --up: #0b7a3e;
  --down: #c4262e;
  --warn: #9a5b00;
  --warn-fill: #fab219;
  --s1: #2a78d6;
  --s2: #eb6834;
  --shadow: 0 1px 2px rgba(14, 22, 33, .06), 0 4px 16px rgba(14, 22, 33, .05);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-display: "SF Pro Display", system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --surface: #141a22; --surface-2: #1b222c; --ink: #e7ecf2; --ink-2: #aab4c2; --muted: #7c8695;
    --line: #242c37; --line-strong: #343e4b; --accent: #7ea4ff; --accent-ink: #0c1016; --up: #3ccf7c; --down: #ff6f6f;
    --warn: #f2b63d; --warn-fill: #fab219; --s1: #3987e5; --s2: #d95926;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --surface: #141a22; --surface-2: #1b222c; --ink: #e7ecf2; --ink-2: #aab4c2; --muted: #7c8695;
  --line: #242c37; --line-strong: #343e4b; --accent: #7ea4ff; --accent-ink: #0c1016; --up: #3ccf7c; --down: #ff6f6f;
  --warn: #f2b63d; --warn-fill: #fab219; --s1: #3987e5; --s2: #d95926;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: 0; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--ink-2); }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.mast .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { min-width: 0; flex: 1 1 320px; display: flex; flex-direction: column; gap: 1px; }
.brand h1 { margin: 0; font: 650 19px/1.2 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.brand h1 .alt { font-weight: 450; color: var(--muted); margin-left: 8px; font-size: 15px; }
.brand .meta { color: var(--ink-2); font-size: 12.5px; }
.mast-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.nav { border-top: 1px solid var(--line); }
.nav .wrap { padding-block: 0; }
.nav-scroll { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav-scroll::-webkit-scrollbar { display: none; }
.nav button { flex: none; border: 0; background: none; padding: 8px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; }
.nav button:hover { color: var(--ink); border-bottom-color: var(--line-strong); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.chip.good { color: var(--up); border-color: color-mix(in oklab, var(--up) 40%, var(--line)); background: color-mix(in oklab, var(--up) 8%, var(--surface)); }
.chip.bad { color: var(--down); border-color: color-mix(in oklab, var(--down) 40%, var(--line)); background: color-mix(in oklab, var(--down) 8%, var(--surface)); }
.chip.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn-fill) 55%, var(--line)); background: color-mix(in oklab, var(--warn-fill) 14%, var(--surface)); }
.health { position: relative; }
.health summary { list-style: none; cursor: pointer; }
.health summary::-webkit-details-marker { display: none; }
.health .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: min(320px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; }
.health .pop h4 { margin: 0 0 6px; font-size: 13px; }
.health .pop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.health .pop li { display: flex; justify-content: space-between; gap: 12px; }

/* sections */
main { padding-block: 20px 8px; display: grid; gap: 28px; }
section { scroll-margin-top: 120px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font: 650 17px/1.25 var(--font-display); letter-spacing: -.005em; text-wrap: balance; }
.sec-head .hint { color: var(--muted); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
:lang(zh) .panel h3 { letter-spacing: .02em; }
.empty-note { color: var(--muted); font-size: 13px; padding: 6px 0; }

/* brief */
.brief { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
.summary-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 72ch; }
.summary-list li { display: grid; grid-template-columns: 6px 1fr; gap: 12px; font-size: 14.5px; line-height: 1.55; }
.summary-list li::before { content: ""; width: 6px; height: 6px; margin-top: .6em; border-radius: 50%; background: var(--line-strong); }
.summary-list li .lead { font-weight: 650; }
.regime-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.regime-row .ew { color: var(--ink-2); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: var(--surface); }
.tile .lab { font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.tile .val { font: 650 26px/1.1 var(--font-display); letter-spacing: -.01em; }
.tile .pct { font-size: 11.5px; color: var(--muted); }
.meter { height: 4px; border-radius: 4px; background: color-mix(in oklab, var(--s1) 18%, var(--surface)); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--s1); border-radius: 4px; }
.tile.ext { border-color: color-mix(in oklab, var(--warn-fill) 55%, var(--line)); }
.tile .flag { font-size: 11px; font-weight: 650; color: var(--warn); }

.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.bench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (max-width: 980px) and (min-width: 641px) { .bench { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.bm { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.bm-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bm-top b { font-family: var(--font-mono); font-size: 14px; }
.bm-top span { color: var(--ink-2); font-size: 13px; }
.bm-rets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.bm-rets div { display: grid; gap: 0; font-size: 13px; }
.bm-rets small { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* charts */
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { width: 10px; height: 10px; border-radius: 2px; }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart text.end { fill: var(--ink-2); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 120px; max-width: 260px; }
.tip .t { font-weight: 650; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* signals */
.changes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1.1fr); gap: 12px; align-items: start; }
.stack2 { display: grid; gap: 12px; min-width: 0; }
.sig-rows .rowbtn { align-items: start; }
.sig-rows .rowbtn .ink2 { white-space: normal; }
.tk-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tk { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px;
  padding: 3px 8px; cursor: pointer; font-size: 12.5px; }
.tk:hover { border-color: var(--accent); }
.tk b { font-family: var(--font-mono); font-weight: 650; font-size: 12.5px; }
.rows { display: grid; gap: 4px; }
.rowbtn { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0;
  background: none; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.rowbtn:hover { background: var(--surface-2); }
.rowbtn b { font-family: var(--font-mono); font-weight: 650; min-width: 4.5ch; }
.rowbtn .ink2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.movers h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.patterns { margin-top: 12px; }
.pat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 16px; }
.pat { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.pat .meter { grid-column: 1 / -1; height: 3px; }
.pat.hot .lab::after { content: " ●"; color: var(--warn); font-size: 10px; }

/* names table */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.fchip:hover:not([aria-pressed="true"]) { border-color: var(--ink-2); color: var(--ink); }
.filters .grow { flex: 1 1 200px; display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.search { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit;
  font-size: 13px; width: 190px; max-width: 100%; }
.search::placeholder { color: var(--muted); }
.filter-label { font-size: 12px; color: var(--muted); }
.count-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin: 2px 0 8px; font-size: 12.5px; color: var(--ink-2); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
@media (min-width: 900px) { .tbl-wrap.tall { max-height: 74vh; } }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 2; background: var(--surface); font-size: 11.5px; font-weight: 600; color: var(--ink-2); vertical-align: bottom; }
th.l, td.l { text-align: left; }
th button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; display: inline-flex; gap: 3px; align-items: center; }
th button:hover { color: var(--ink); }
th[aria-sort] button { color: var(--ink); }
th .arr { font-size: 9px; width: 8px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.sticky, th.sticky { position: sticky; left: 0; z-index: 1; background: var(--surface); }
th.sticky { z-index: 3; }
td.sticky { box-shadow: 1px 0 0 var(--line); }
.tkcell { display: grid; gap: 0; }
.tkcell b { font-family: var(--font-mono); font-size: 13px; }
.tkcell small { color: var(--muted); font-size: 11.5px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.stars { color: var(--ink); letter-spacing: 1px; font-size: 12px; }
.stars .off { color: var(--line-strong); }
.dir { font-size: 11.5px; margin-left: 6px; font-weight: 600; }
.delta { font-size: 10.5px; margin-left: 4px; font-weight: 700; }
.rsi-tag { font-size: 10px; font-weight: 700; margin-left: 4px; color: var(--warn); }
.spark { display: block; }
.earn-cell small { color: var(--muted); margin-left: 4px; }

/* clusters */
.cl-table td.heat { min-width: 68px; }
.cl-table td.sel, .cl-table th.sel { box-shadow: inset 2px 0 0 var(--ink-2), inset -2px 0 0 var(--ink-2); }
.cl-table thead th.sel { box-shadow: inset 2px 0 0 var(--ink-2), inset -2px 0 0 var(--ink-2), inset 0 2px 0 var(--ink-2); }
.cl-table tbody tr:last-child td.sel { box-shadow: inset 2px 0 0 var(--ink-2), inset -2px 0 0 var(--ink-2), inset 0 -2px 0 var(--ink-2); }
.cl-table tr.bench-row td { color: var(--ink-2); background: var(--surface-2); cursor: default; }
.cl-table tr.bench-row:hover td { background: var(--surface-2); }
.cl-table tr.active td { font-weight: 650; }
.cl-name { display: grid; }
.cl-name small { color: var(--muted); font-size: 11.5px; }
.rank { display: inline-flex; gap: 6px; align-items: baseline; }
.mini-meter { display: inline-grid; grid-template-columns: 54px auto; gap: 8px; align-items: center; }
.mini-meter .meter { height: 4px; }

/* earnings */
.weeks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.week.crowded { border-color: color-mix(in oklab, var(--warn-fill) 60%, var(--line)); }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.week-head b { font-size: 13.5px; }
.week-head span { font-size: 12px; color: var(--muted); }
.alert { display: grid; grid-template-columns: auto 1fr; gap: 6px; font-size: 12.5px; color: var(--ink); padding: 6px 8px; border-radius: 6px;
  background: color-mix(in oklab, var(--warn-fill) 16%, var(--surface)); }
.alert .ic { color: var(--warn); font-weight: 800; }
.ev { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; font-size: 13px; padding: 4px 6px; margin: 0 -6px;
  border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: calc(100% + 12px); }
.ev:hover { background: var(--surface-2); }
.ev .d { color: var(--ink-2); font-size: 12px; line-height: 1.25; }
.ev .d small { display: block; color: var(--muted); font-size: 11px; }
.ev .who { min-width: 0; display: grid; }
.ev .who b { font-family: var(--font-mono); font-size: 13px; }
.ev .who b.crowd::after { content: " ●"; color: var(--warn); font-size: 10px; }
.ev .who small { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .mv { color: var(--ink-2); font-size: 12.5px; }

/* fundamentals */
.fund { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
.fund .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.bar2 { display: grid; grid-template-columns: 1fr 1fr; width: 96px; height: 10px; align-items: center; }
.bar2 .neg, .bar2 .pos { height: 8px; position: relative; }
.bar2 .neg { border-right: 1px solid var(--line-strong); }
.bar2 .neg i { position: absolute; right: 0; top: 0; bottom: 0; background: var(--down); border-radius: 3px 0 0 3px; }
.bar2 .pos i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--up); border-radius: 0 3px 3px 0; }
.revcell { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
.capnote { font-size: 13.5px; color: var(--ink); margin: 0 0 10px; max-width: 70ch; }
.ocf-row text.ocf { fill: var(--ink-2); font-weight: 600; }

/* detail dialog */
dialog#detail { border: 0; padding: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(560px, 100vw); max-width: 100vw;
  background: var(--surface); color: var(--ink); box-shadow: -8px 0 32px rgba(0, 0, 0, .18); }
dialog#detail::backdrop { background: rgba(8, 12, 18, .38); }
.dlg { padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
  display: grid; gap: 16px; }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dlg-head h2 { margin: 0; font: 650 22px/1.15 var(--font-display); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.dlg-head h2 .mono { font-size: 22px; }
.dlg-head h2 small { font: 450 14px/1.3 var(--font-ui); color: var(--ink-2); }
.dlg-head .sub { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--ink-2); align-items: center; }
.xbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; flex: none; }
.price-line { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.price-line .px { font: 650 28px/1.1 var(--font-display); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px 14px; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.kv span { font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dsec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; color: var(--ink); background: var(--surface-2); }

/* footer */
footer { margin-top: 24px; border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 18px 28px; display: grid; gap: 12px; font-size: 13px; color: var(--ink-2); }
footer details summary { cursor: pointer; color: var(--ink); font-weight: 600; }
footer details p { max-width: 80ch; margin: 8px 0 0; }
footer dl { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; max-width: 90ch; }
footer dt { font-weight: 600; color: var(--ink); }
footer dd { margin: 0; }
.nia { font-weight: 650; color: var(--ink); }

/* no data */
.nodata { max-width: 560px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; gap: 14px; }
.nodata h2 { margin: 0; font: 650 20px/1.25 var(--font-display); }
.nodata p { margin: 0; color: var(--ink-2); }
.nodata .zh { border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 980px) {
  .brief, .fund { grid-template-columns: minmax(0, 1fr); }
  .changes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .changes > :last-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .changes, .bench { grid-template-columns: minmax(0, 1fr); }
  .changes > :last-child { grid-column: auto; }
  .hide-sm { display: none; }
  td .dir { display: none; }
  .tkcell small { max-width: 92px; }
  .cl-table .per:not(.sel) { display: none; }
  .bar2 { display: none; }
  .fund-tbl th, .fund-tbl td { padding-left: 6px; padding-right: 6px; }
  .brand h1 { font-size: 17px; }
  .brand h1 .alt { display: none; }
  .tile .val { font-size: 22px; }
  .panel { padding: 14px; }
  .filters .grow { justify-content: flex-start; }
  .search { width: 100%; }
  dialog#detail { width: 100vw; }
}
@media (prefers-reduced-motion: no-preference) {
  .tk, .fchip, .seg button, tbody td { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>
